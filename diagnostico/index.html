/* Layout: una sola columna tipo cuaderno de trabajo; una etapa por pantalla, barra de avance arriba,
   resultado como ranking de las cinco dimensiones. Misma marca que la web de Simoné. */
:root {
  --cream: #F6F0E2; --paper: #FCF9F2; --olive: #363A12; --olive-soft: #5C6132;
  --rust: #8A3300; --heart: #F2A03D; --magenta: #BE1A82; --line: #DCD3BC;
  --good: #4F6B2A; --mid: #C9861F; --high: #A8321C; --on-olive: #F6F0E2;
  --logo-light: block; --logo-dark: none;
  --display: "Montserrat", "Avenir Next", "Segoe UI", Arial, sans-serif;
  --body: "Lato", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --cream: #1B1D0D; --paper: #24271A; --olive: #EFE9D8; --olive-soft: #C2BEA6;
    --rust: #E8895A; --heart: #F2A03D; --magenta: #E764B3; --line: #3B3F24;
    --good: #93B46A; --mid: #E6AE4E; --high: #EF7B60; --on-olive: #1B1D0D;
    --logo-light: none; --logo-dark: block; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --cream: #1B1D0D; --paper: #24271A; --olive: #EFE9D8; --olive-soft: #C2BEA6;
  --rust: #E8895A; --heart: #F2A03D; --magenta: #E764B3; --line: #3B3F24;
  --good: #93B46A; --mid: #E6AE4E; --high: #EF7B60; --on-olive: #1B1D0D;
  --logo-light: none; --logo-dark: block; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--cream); color: var(--olive); font-family: var(--body); font-size: 1.0625rem; line-height: 1.55; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.15; text-wrap: balance; }
p { margin: 0; }
img { max-width: 100%; display: block; }
:focus-visible { outline: 3px solid var(--magenta); outline-offset: 3px; border-radius: 6px; }
.wrap { max-width: 760px; margin-inline: auto; padding-inline: 16px; }

header.top { border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px; }
.logo { flex-shrink: 0; }
.logo img { height: 44px; width: auto; max-width: none; }
.logo .l-light { display: var(--logo-light); } .logo .l-dark { display: var(--logo-dark); }
.meta { font-family: var(--display); font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--rust); }

main { padding-block: 32px 72px; }
.eyebrow { font-family: var(--display); font-weight: 600; font-size: 0.8125rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--rust); }
.lead { color: var(--olive-soft); font-size: 1.125rem; max-width: 60ch; }

/* Avance */
.progress { display: grid; gap: 10px; margin-bottom: 28px; }
.progress-bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress-bar span { display: block; height: 100%; background: var(--rust); width: 0; transition: width .3s ease; }
.progress-label { display: flex; justify-content: space-between; gap: 12px; font-size: 0.875rem; color: var(--olive-soft); font-variant-numeric: tabular-nums; }

/* Intro */
.intro { display: grid; gap: 22px; }
.intro h1 { font-size: clamp(1.9rem, 1.4rem + 2.4vw, 2.8rem); font-weight: 600; letter-spacing: -0.01em; }
.dims { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 0; border-top: 1px solid var(--line); }
.dims li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding-block: 12px; border-bottom: 1px solid var(--line); }
.dims b { font-family: var(--display); font-weight: 700; color: var(--rust); }
.dims span { display: block; color: var(--olive-soft); font-size: 0.9375rem; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; }
.facts span { background: var(--paper); border: 1px solid var(--line); border-radius: 99px; padding: 6px 14px; font-size: 0.9375rem; }

/* Preguntas */
.step { display: grid; gap: 26px; }
.step-head { display: grid; gap: 10px; }
.step-head h2 { font-size: clamp(1.6rem, 1.3rem + 1.4vw, 2.2rem); font-weight: 600; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; display: grid; gap: 12px; }
legend { font-family: var(--display); font-weight: 600; font-size: 1.125rem; line-height: 1.35; padding: 0; margin-bottom: 12px; }
.q-kind { display: block; font-family: var(--body); font-weight: 400; font-size: 0.875rem; color: var(--olive-soft); margin-bottom: 4px; }
.scale { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.opts { display: grid; gap: 10px; }
.choice { position: relative; }
.choice input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.choice label { display: block; height: 100%; background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; transition: border-color .15s, background .15s; font-size: 1rem; line-height: 1.4; }
.scale .choice label { text-align: center; font-family: var(--display); font-weight: 600; font-size: 0.9375rem; padding: 12px 6px; }
.choice input:hover + label { border-color: var(--olive-soft); }
.choice input:checked + label { border-color: var(--rust); background: color-mix(in srgb, var(--rust) 9%, var(--paper)); box-shadow: inset 0 0 0 1px var(--rust); }
.choice input:focus-visible + label { outline: 3px solid var(--magenta); outline-offset: 2px; }
@media (max-width: 520px) { .scale { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.qblock { padding-top: 22px; border-top: 1px solid var(--line); }
.qblock:first-of-type { padding-top: 0; border-top: 0; }

.field { display: grid; gap: 6px; }
.field label { font-family: var(--display); font-weight: 600; font-size: 0.9375rem; }
.field input, .field select { font: inherit; color: var(--olive); background: var(--paper); border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 12px; width: 100%; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }

.nav { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: center; margin-top: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-family: var(--display); font-weight: 600; font-size: 1rem; padding: 13px 24px; border-radius: 99px; border: 2px solid var(--olive); background: var(--olive); color: var(--cream); cursor: pointer; text-decoration: none; }
.btn:hover { background: var(--rust); border-color: var(--rust); }
.btn[disabled] { opacity: .45; cursor: not-allowed; background: var(--olive); border-color: var(--olive); }
.btn-ghost { background: transparent; color: var(--olive); }
.btn-ghost:hover { background: transparent; color: var(--rust); border-color: var(--rust); }
.btn svg { width: 20px; height: 20px; }
.hint { font-size: 0.875rem; color: var(--olive-soft); }

/* Resultado */
.result { display: grid; gap: 30px; }
.result h1 { font-size: clamp(1.8rem, 1.3rem + 2.2vw, 2.6rem); font-weight: 600; }
.bars { display: grid; gap: 14px; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: baseline; }
.bar-name { font-family: var(--display); font-weight: 600; font-size: 1rem; }
.bar-val { font-variant-numeric: tabular-nums; font-size: 0.9375rem; color: var(--olive-soft); white-space: nowrap; }
.bar-val b { color: var(--olive); }
.bar-track { grid-column: 1 / -1; height: 12px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 99px; }
.lvl { display: inline-block; font-family: var(--display); font-weight: 600; font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 9px; border-radius: 99px; margin-left: 8px; vertical-align: 1px; }
.lvl-good { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
.lvl-mid { color: var(--mid); background: color-mix(in srgb, var(--mid) 16%, transparent); }
.lvl-high { color: var(--high); background: color-mix(in srgb, var(--high) 14%, transparent); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.8125rem; color: var(--olive-soft); }

.rec { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 24px 22px; display: grid; gap: 14px; }
.rec.main { border: 2px solid var(--rust); }
.rec .tag { font-family: var(--display); font-weight: 700; font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--rust); }
.rec h3 { font-size: 1.375rem; }
.rec .line { font-size: 0.9375rem; color: var(--olive-soft); }
.rec dl { margin: 0; display: grid; gap: 10px; }
.rec dt { font-family: var(--display); font-weight: 700; font-size: 0.8125rem; letter-spacing: 0.06em; text-transform: uppercase; }
.rec dd { margin: 2px 0 0; }

.cta { background: var(--olive); color: var(--on-olive); border-radius: 18px; padding: 26px 22px; display: grid; gap: 16px; }
.cta h2 { font-size: 1.5rem; color: var(--on-olive); }
.cta p { color: color-mix(in srgb, var(--on-olive) 85%, transparent); }
.cta .field label { color: var(--on-olive); }
.cta .field input { border-color: transparent; }
.cta .btn { background: var(--heart); border-color: var(--heart); color: #2A2C0E; }
.cta .btn:hover { background: var(--cream); border-color: var(--cream); }
.cta .small { font-size: 0.875rem; }
.cta-eyebrow { font-family: var(--display); font-weight: 700; font-size: 0.75rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--heart); }
.path { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 0; }
.path > li { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 14px; padding-block: 18px; border-top: 1px solid color-mix(in srgb, var(--on-olive) 22%, transparent); }
.path-n { width: 32px; height: 32px; border-radius: 50%; background: var(--heart); color: #2A2C0E; font-family: var(--display); font-weight: 700; display: grid; place-items: center; }
.path-body { display: grid; gap: 10px; min-width: 0; }
.path-body h3 { font-size: 1.125rem; color: var(--on-olive); }
.slots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 560px) { .slots { grid-template-columns: 1fr; } }
.cta .field label { font-size: 0.875rem; }
.consent { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 0.875rem; line-height: 1.45; cursor: pointer; }
.consent input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--heart); }
.copy-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.cta .btn-light { background: transparent; color: var(--on-olive); border-color: color-mix(in srgb, var(--on-olive) 60%, transparent); padding: 10px 18px; font-size: 0.9375rem; }
.cta .btn-light:hover { background: transparent; color: var(--on-olive); border-color: var(--on-olive); }
.copied { font-size: 0.875rem; }

footer { border-top: 1px solid var(--line); padding-block: 22px; font-size: 0.875rem; color: var(--olive-soft); }
footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; }
@media (prefers-reduced-motion: reduce) { .progress-bar span { transition: none; } }

      d.text("Agenda la sesión: WhatsApp +57 321 773 8039", M + 6, y + 6.5);
      d.setFont("helvetica", "normal"); d.setFontSize(9.5);
      d.text("experienciasimone@gmail.com  ·  www.experienciasimone.com", M + 6, y + 11.8);
      return d;
    });
  }

  function fileName() {
    var base = (state.company || "mi-empresa").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "mi-empresa";
    return "Diagnostico-Simone-" + base + ".pdf";
  }

  function renderResult() {
    var results = MODS.map(score);
    var ranked = results.slice().sort(function (a, b) { return b.need - a.need || MODS.indexOf(a.m) - MODS.indexOf(b.m); });
    var withRec = ranked.filter(function (r) { return r.rec; });
    var main = withRec[0], second = null;
    for (var i = 1; i < withRec.length; i++) { if (withRec[i].rec !== main.rec && withRec[i].need >= 34) { second = withRec[i]; break; } }
    if (!state.group) state.group = ["", "", "", "", "", ""];
    var prio = main ? main.m.name.toLowerCase() : "lo que quieren fortalecer";

    var headline = main
      ? 'Tu prioridad hoy: <span style="color:var(--rust)">' + esc(main.m.name.toLowerCase()) + '</span>'
      : 'Tu organización está en un buen momento';
    var html = '<section class="result">' +
      '<div class="step-head"><p class="eyebrow">Tu resultado</p><h1>' + headline + '</h1>' +
      '<p class="lead">' + (main ? 'Así se ven las cinco dimensiones. Entre más alta la barra, más urgente es trabajar en ella.' : 'Ninguna dimensión aparece como urgente. Podemos ayudarte a sostener lo que ya funciona.') + '</p></div>' +
      '<div class="bars" role="list">' + ranked.map(function (r) {
        var lv = level(r.need);
        return '<div class="bar" role="listitem"><span class="bar-name">' + esc(r.m.name) + '<span class="lvl lvl-' + lv.k + '">' + lv.t + '</span></span><span class="bar-val"><b>' + r.need + '</b> / 100</span>' +
          '<div class="bar-track"><div class="bar-fill" style="width:' + Math.max(r.need, 3) + '%;background:' + lv.c + '"></div></div></div>';
      }).join("") + '</div>' +
      '<p class="legend"><span>0–33: fortaleza</span><span>34–66: por fortalecer</span><span>67–100: prioridad</span></p>' +
      (main ? recCard(main, true) : '') + (second ? recCard(second, false) : '') +

      '<section class="cta" aria-labelledby="cta-h">' +
      '<p class="cta-eyebrow">Siguiente paso</p>' +
      '<h2 id="cta-h">Una sesión vivencial de diagnóstico con 6 personas de tu equipo</h2>' +
      '<p>Antes de reunirnos, selecciona un grupo de 6 personas con las que podamos tener una sesión complementaria de diagnóstico. En 90 minutos vivirán una muestra de nuestro modelo El Borde Visible™: observarán una obra con una rutina de pensamiento visible de Harvard Project Zero, crearán una pieza en grupo y conversarán sobre su prioridad: ' + esc(prio) + '. Tú ves cómo trabajamos; nosotros vemos tu cultura desde adentro.</p><p><strong>La sesión tiene un valor que se abona en su totalidad al servicio que contraten con Simoné.</strong></p>' +
      '<ol class="path">' +
        '<li><div class="path-n">1</div><div class="path-body"><h3>Recibe tu informe en PDF</h3><p>Tu resultado, las recomendaciones y la guía para armar el grupo. Déjanos tus datos para descargarlo y para que Nathalia pueda acompañarte.</p>' +
          '<div class="grid2">' +
            '<div class="field"><label for="f-name">Tu nombre *</label><input id="f-name" autocomplete="name" value="' + esc(state.name) + '"></div>' +
            '<div class="field"><label for="f-cargo">Cargo *</label><input id="f-cargo" autocomplete="organization-title" placeholder="Ej.: Directora de Gestión Humana" value="' + esc(state.cargo) + '"></div>' +
            '<div class="field"><label for="f-company">Empresa *</label><input id="f-company" autocomplete="organization" value="' + esc(state.company) + '"></div>' +
            '<div class="field"><label for="f-email">Correo de trabajo *</label><input id="f-email" type="email" autocomplete="email" inputmode="email" value="' + esc(state.email) + '"></div>' +
            '<div class="field"><label for="f-phone">Celular o WhatsApp (opcional)</label><input id="f-phone" type="tel" autocomplete="tel" inputmode="tel" value="' + esc(state.phone) + '"></div>' +
          '</div>' +
          '<label class="consent"><input type="checkbox" id="f-consent"' + (state.autoriza ? ' checked' : '') + '><span>Autorizo a Simoné, Creación Arte y Naturaleza S.A.S. a guardar estos datos, mi resultado y el grupo para contactarme sobre sus servicios, según la Ley 1581 de 2012 de protección de datos. *</span></label>' +
          '<div class="copy-row"><button class="btn" id="pdf" type="button">Descargar informe en PDF</button><span class="copied" id="pdf-msg" role="status"></span></div></div></li>' +
        '<li><div class="path-n">2</div><div class="path-body"><h3>Elige a las 6 personas</h3><p>Dos que deciden, dos que lideran equipos y dos que viven el reto de cerca' + (state.profile.oper === 0 ? ', al menos una del personal operativo' : '') + '. ' + esc(main && GROUP_HINT[main.m.id] ? GROUP_HINT[main.m.id] : '') + '</p>' +
          '<div class="slots">' + SLOTS.map(function (s, i) {
            return '<div class="field"><label for="g-' + i + '">Persona ' + (i + 1) + ' · ' + s.toLowerCase() + '</label><input id="g-' + i + '" placeholder="' + SLOT_PH[i] + '" value="' + esc(state.group[i]) + '"></div>';
          }).join("") + '</div><p class="small">Escribe cargos o nombres. Es opcional, pero nos ayuda a preparar la sesión.</p></div></li>' +
        '<li><div class="path-n">3</div><div class="path-body"><h3>Agenda la sesión por WhatsApp</h3><p>Nathalia Velasco recibe tu resultado y el grupo, y te propone fechas.</p>' +
          '<div class="copy-row"><a class="btn btn-wa" id="send" target="_blank" rel="noopener" href="#"><svg aria-hidden="true"><use href="#wa"/></svg>Agendar la sesión por WhatsApp</a>' +
          '<button class="btn btn-light" id="copy" type="button">Copiar resumen</button><span class="copied" id="copied" role="status"></span></div>' +
          '<p class="small">También puedes escribir al +57 321 773 8039 o a experienciasimone@gmail.com.</p></div></li>' +
      '</ol></section>' +
      '<div class="nav"><button class="btn btn-ghost" id="restart">Volver a empezar</button><a class="btn btn-ghost" href="https://www.experienciasimone.com">Conocer Simoné</a></div>' +
      '</section>';
    app.innerHTML = html;

    var send = document.getElementById("send");
    function refresh() {
      state.name = document.getElementById("f-name").value.trim();
      state.company = document.getElementById("f-company").value.trim();
      state.cargo = document.getElementById("f-cargo").value.trim();
      state.email = document.getElementById("f-email").value.trim();
      state.phone = document.getElementById("f-phone").value.trim();
      state.autoriza = document.getElementById("f-consent").checked;
      for (var k = 0; k < 6; k++) state.group[k] = document.getElementById("g-" + k).value.trim();
      send.href = "https://wa.me/" + WA + "?text=" + encodeURIComponent(summary(results, ranked));
    }
    refresh();
    app.querySelectorAll(".cta input").forEach(function (inp) { inp.oninput = refresh; inp.onchange = refresh; });
    var ctx = { results: results, main: main, second: second };
    logEvent("resultado", ctx);
    send.addEventListener("click", function () { refresh(); logEvent("whatsapp", ctx); });

    document.getElementById("pdf").onclick = function () {
      refresh();
      var msg = document.getElementById("pdf-msg"), btn = this;
      var missing = [];
      if (!state.name) missing.push("tu nombre");
      if (!state.cargo) missing.push("tu cargo");
      if (!state.company) missing.push("la empresa");
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.email)) missing.push("un correo válido");
      if (!state.autoriza) missing.push("la autorización de datos");
      if (missing.length) {
        msg.textContent = "Para descargar el informe falta: " + missing.join(", ") + ".";
        var first = !state.name ? "f-name" : !state.cargo ? "f-cargo" : !state.company ? "f-company" : !state.autoriza && /@/.test(state.email) ? "f-consent" : "f-email";
        if (!state.autoriza && state.name && state.cargo && state.company && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.email)) first = "f-consent";
        document.getElementById(first).focus();
        return;
      }
      logEvent("pdf", { results: results, main: main, second: second });
      btn.disabled = true; msg.textContent = "Preparando tu informe…";
      buildPDF(results, ranked, main, second).then(function (d) {
        var name = fileName();
        var viaViewer = window.claude && window.claude.use ? window.claude.use("downloads") : Promise.resolve(null);
        return viaViewer.then(function (dl) {
          if (dl) return dl.save({ filename: name, data: d.output("blob") }).then(function () { msg.textContent = "Informe listo."; });
          d.save(name); msg.textContent = "Informe descargado.";
        });
      }).catch(function (e) {
        msg.textContent = (e && e.code === "declined") ? "Descarga cancelada." : "No se pudo crear el PDF aquí. Usa el resumen por WhatsApp.";
      }).then(function () { btn.disabled = false; });
    };

    document.getElementById("copy").onclick = function () {
      refresh();
      var txt = summary(results, ranked), msg = document.getElementById("copied");
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(function () { msg.textContent = "Resumen copiado."; }, function () { msg.textContent = "No se pudo copiar. Usa el botón de WhatsApp."; });
      } else { msg.textContent = "No se pudo copiar. Usa el botón de WhatsApp."; }
    };
    document.getElementById("restart").onclick = function () { state = { step: 0, answers: {}, profile: {}, close: {}, name: "", company: "", cargo: "", email: "", phone: "", autoriza: false }; render(); top(); };
  }

  function render() {
    var s = state.step;
    if (s === 0) return renderIntro();
    if (s === 1) return renderProfile();
    if (s <= MODS.length + 1) return renderModule(s - 2);
    if (s === MODS.length + 2) return renderClose();
    return renderResult();
  }
  render();
})();
</script>
</body>
</html>
