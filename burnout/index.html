.strip { margin: 0; }

@media (max-width: 520px) { .strip-grid { grid-template-columns: 1fr 1fr; } .strip-grid img:first-child { grid-column: span 2; aspect-ratio: 16 / 10; } }

.cta .btn { background: var(--heart); border-color: var(--heart); color: #2A2C0E; }
.cta .btn:hover { background: var(--cream); border-color: var(--cream); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.status { font-size: 0.875rem; }
footer { border-top: 1px solid var(--line); padding-block: 22px; font-size: 0.875rem; color: var(--olive-soft); }
footer .wrap { display: grid; gap: 6px; }
@media (prefers-reduced-motion: reduce) { .progress-bar span { transition: none; } }
</style>

<script>

  var DIMS = [

      items: [

    { id: "logro", name: "Tu sentido de logro", sub: "Propósito y eficacia", desc: "Si sientes que tu trabajo tiene valor y que lo haces bien.", inverse: true,

  var TIPS = {

  var app = document.getElementById("app");

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function top() { window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); }

  function intro() {

      '<p class="eyebrow">Inventario de Equilibrio Laboral</p>' +

      '<p class="lead">Este inventario no califica quién eres, sino cómo está interactuando tu entorno profesional con tu energía vital. Lee cada frase y marca con honestidad con qué frecuencia la vives en tu día a día.</p>' +

      '<ul class="dims">' + DIMS.map(function (d) { return '<li><strong>' + esc(d.name) + '</strong><span>' + esc(d.desc) + '</span></li>'; }).join("") + '</ul>' +

  function dimStep(di) {

      '<section class="step"><div class="step-head"><p class="eyebrow">' + esc(d.sub) + '</p><h2>' + esc(d.name) + '</h2><p class="lead">' + esc(d.desc) + '</p></div>';
    d.items.forEach(function (it, ii) {
      var n = d.id + "-" + ii;
      html += '<fieldset><legend>' + esc(it) + '</legend><div class="scale">' + SCALE.map(function (s, v) {
        return '<div class="choice"><input type="radio" id="' + n + '-' + v + '" name="' + n + '" value="' + v + '"' + (a[ii] === v ? " checked" : "") + '><label for="' + n + '-' + v + '">' + s + '</label></div>';
      }).join("") + '</div></fieldset>';
    });
    html += '<div class="nav"><button class="btn btn-ghost" id="back">Atrás</button><button class="btn" id="next" disabled>' + (di === TOTAL - 1 ? "Ver mi resultado" : "Continuar") + '</button></div></section>';

    var next = document.getElementById("next");
    function check() { next.disabled = !d.items.every(function (_, i) { return a[i] != null; }); }
    check();
    app.querySelectorAll('input[type="radio"]').forEach(function (inp) {
      inp.onchange = function () { a[+inp.name.split("-")[1]] = +inp.value; check(); };

    next.onclick = function () { state.step++; render(); top(); };

      var sum = state.a[d.id].reduce(function (x, y) { return x + y; }, 0), max = d.items.length * 4;

      return { d: d, pct: pct, risk: risk, lv: level(risk) };

    var html = '<section class="result">' +

      '<div class="meters" role="list">' + c.res.map(function (r) {
        var label = r.d.inverse ? (r.pct + " / 100 de logro") : (r.pct + " / 100 de " + (r.d.id === "energia" ? "desgaste" : "distancia"));
        return '<div class="meter" role="listitem"><span class="meter-name">' + esc(r.d.name) + '<span class="lvl lvl-' + r.lv.k + '">Riesgo ' + r.lv.t.toLowerCase() + '</span></span><span class="meter-val">' + label + '</span>' +
          '<div class="meter-track"><div class="meter-fill" style="width:' + Math.max(r.pct, 3) + '%;background:' + r.lv.c + '"></div></div>' +
          '<span class="meter-sub">' + esc(r.d.desc) + (r.d.inverse ? " Aquí, una barra más larga es mejor." : " Aquí, una barra más larga indica más desgaste.") + '</span></div>';
      }).join("") + '</div>' +
      (focus.length ? '<div class="tips"><h2 style="font-size:1.375rem">Por dónde empezar</h2>' + focus.map(function (r) {
        var T = TIPS[r.d.id]; return '<article class="tip"><h3>' + esc(T.t) + '</h3><ul>' + T.items.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join("") + '</ul></article>';
      }).join("") + '</div>' : '') +
      '<div class="row"><button class="btn" id="pdf" type="button">Descargar mi resultado en PDF</button><span class="status" id="pdf-msg" role="status"></span></div>' +
      '<figure class="strip"><div class="strip-grid"><img src="img/dibujo-piso.jpg" alt="Una participante dibuja en el piso durante una sesión de bienestar" loading="lazy"><img src="img/acuarela-mesa.jpg" alt="Participantes pintan con acuarela alrededor de una mesa" loading="lazy"><img src="img/collage-piso.jpg" alt="Collages, acuarelas y cartas sobre el piso al final de una sesión" loading="lazy"></div><figcaption>Así se viven nuestras experiencias de bienestar.</figcaption></figure>' +
      '<section class="cta" aria-labelledby="cta-h"><h2 id="cta-h">¿Lideras un equipo o un área de bienestar?</h2>' +
      '<p>Podemos aplicar este inventario a tu equipo de forma anónima y entregarte un mapa de energía por áreas, sin datos personales. Es el primer paso de <strong>Equilibrio Total</strong>, nuestro acompañamiento de 6 meses para prevenir el agotamiento laboral, y de la <strong>Escuela de Ecología Emocional</strong>, para que cada persona aprenda a gestionar su energía y sus relaciones.</p>' +
      '<div class="row"><a class="btn" target="_blank" rel="noopener" href="https://wa.me/' + WA + '?text=' + encodeURIComponent("Hola Simoné, hice el Inventario de Equilibrio Laboral y quiero saber cómo aplicarlo a mi equipo de forma anónima.") + '"><svg aria-hidden="true"><use href="#wa"/></svg>Quiero medir a mi equipo</a></div>' +
      '<p class="hint" style="color:inherit;opacity:.8">Este mensaje no incluye tus resultados.</p></section>' +
      '<div class="nav"><button class="btn btn-ghost" id="restart">Volver a empezar</button><a class="btn btn-ghost" href="https://www.experienciasimone.com">Conocer Simoné</a></div></section>';
    app.innerHTML = html;
    document.getElementById("restart").onclick = function () { state = { step: 0, a: {} }; render(); top(); };
    document.getElementById("pdf").onclick = function () {
      gcOnce("burnout-pdf", "Test de burnout: PDF");
      var msg = document.getElementById("pdf-msg"), btn = this; btn.disabled = true; msg.textContent = "Preparando tu informe…";
      buildPDF(c, P, focus).then(function (d) {
        var name = "Equilibrio-Laboral-Simone.pdf";
        var v = window.claude && window.claude.use ? window.claude.use("downloads") : Promise.resolve(null);
        return v.then(function (dl) {
          if (dl) return dl.save({ filename: name, data: d.output("blob") }).then(function () { msg.textContent = "Informe listo."; });
          d.save(name); msg.textContent = "Informe descargado.";
        });
      }).catch(function (e) { msg.textContent = (e && e.code === "declined") ? "Descarga cancelada." : "No se pudo crear el PDF aquí."; })
        .then(function () { btn.disabled = false; });
    };
  }

  function loadImage(src) {
    return fetch(src).then(function (r) { return r.blob(); }).then(function (b) {
      return new Promise(function (res) { var fr = new FileReader(); fr.onload = function () { res(fr.result); }; fr.readAsDataURL(b); });
    }).catch(function () { return null; });
  }

  function buildPDF(c, P, focus) {
    var J = window.jspdf && window.jspdf.jsPDF;
    if (!J) return Promise.reject(new Error("nolib"));
    return loadImage("logo.png").then(function (logo) {
      var d = new J({ unit: "mm", format: "a4" }), W = 210, M = 18, CW = W - 2 * M, y = 18;
      var OL = [54, 58, 18], RU = [138, 51, 0], SOFT = [92, 97, 50], LINE = [220, 211, 188];
      var LV = { good: [79, 107, 42], mid: [201, 134, 31], high: [168, 50, 28] };
      function ensure(h) { if (y + h > 280) { d.addPage(); y = 18; } }
      function text(s, size, color, style, gap) {
        d.setFont("helvetica", style || "normal"); d.setFontSize(size); d.setTextColor.apply(d, color);
        var lines = d.splitTextToSize(String(s), CW), lh = size * 0.45;
        ensure(lines.length * lh + (gap || 0)); d.text(lines, M, y + lh * 0.8); y += lines.length * lh + (gap || 0);
      }
      function rule() { ensure(6); d.setDrawColor.apply(d, LINE); d.setLineWidth(0.3); d.line(M, y, W - M, y); y += 6; }
      if (logo) d.addImage(logo, "PNG", M, y, 46, 11.7);
      d.setFont("helvetica", "bold"); d.setFontSize(9); d.setTextColor.apply(d, RU); d.text("INVENTARIO DE EQUILIBRIO LABORAL", W - M, y + 5, { align: "right" });
      d.setFont("helvetica", "normal"); d.setTextColor.apply(d, SOFT);
      d.text(new Date().toLocaleDateString("es-CO", { day: "numeric", month: "long", year: "numeric" }), W - M, y + 10, { align: "right" });
      y += 22;
      text(P.tag.toUpperCase(), 8.5, LV[P.k], "bold", 1.5);
      text(P.title, 17, OL, "bold", 3);
      text(P.text, 10, OL, "normal", 5); rule();
      text("Tus tres dimensiones", 13, OL, "bold", 4);
      c.res.forEach(function (r) {
        ensure(20);
        d.setFont("helvetica", "bold"); d.setFontSize(10.5); d.setTextColor.apply(d, OL); d.text(r.d.name, M, y + 4);
        d.setFont("helvetica", "normal"); d.setFontSize(9.5); d.setTextColor.apply(d, LV[r.lv.k]);
        d.text("Riesgo " + r.lv.t.toLowerCase() + "  ·  " + r.pct + " / 100", W - M, y + 4, { align: "right" });
        d.setFillColor.apply(d, LINE); d.roundedRect(M, y + 6.5, CW, 3, 1.5, 1.5, "F");
        d.setFillColor.apply(d, LV[r.lv.k]); d.roundedRect(M, y + 6.5, Math.max(CW * r.pct / 100, 3), 3, 1.5, 1.5, "F");
        y += 12;
        text(r.d.desc + (r.d.inverse ? " Aquí, más alto es mejor." : " Aquí, más alto indica más desgaste."), 9, SOFT, "normal", 4);
      });
      if (focus.length) {
        rule(); text("Por dónde empezar", 13, OL, "bold", 3);
        focus.forEach(function (r) { var T = TIPS[r.d.id]; ensure(16); text(T.t, 10.5, OL, "bold", 1); T.items.forEach(function (x) { text("•  " + x, 10, OL, "normal", 0.8); }); y += 3; });
      }
      rule();
      text("Este inventario es una herramienta de autoconocimiento y orientación de Simoné. Se inspira en las tres dimensiones del desgaste laboral descritas por Christina Maslach. No es un diagnóstico médico ni psicológico. Si tu resultado te preocupa, conversa con un profesional de salud.", 8.5, SOFT, "italic", 5);
      ensure(18);
      d.setFillColor.apply(d, OL); d.roundedRect(M, y, CW, 16, 3, 3, "F");
      d.setFont("helvetica", "bold"); d.setFontSize(10.5); d.setTextColor(246, 240, 226);
      d.text("¿Quieres medir el equilibrio de tu equipo? WhatsApp +57 321 773 8039", M + 6, y + 6.5);
      d.setFont("helvetica", "normal"); d.setFontSize(9.5);
      d.text("nathalia@experienciasimone.com  ·  www.experienciasimone.com", M + 6, y + 11.8);
      return d;
    });
  }

  function render() {
    if (state.step === 0) return intro();
    if (state.step <= TOTAL) return dimStep(state.step - 1);
    return result();
  }
  render();
})();
</script>
</body>
